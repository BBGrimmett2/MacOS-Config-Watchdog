name: Validate Ansible manifest exporter PR 26

on:
  pull_request:
    paths:
      - ".github/workflows/validate-ansible-manifest-pr26.yml"

permissions:
  contents: read

jobs:
  ansible-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Ansible feature revision
        uses: actions/checkout@v4
        with:
          repository: BBGrimmett2/Ansible-MacOS-Setup
          ref: 314e94b0a1817360f5fbf0a77f42139d7efae1b4
          path: ansible-setup
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install 'ansible-core>=2.18,<2.21' PyYAML jinja2
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p test_watchdog_manifest.py -v
        working-directory: ansible-setup
      - name: Syntax check
        run: ansible-playbook --syntax-check playbooks/export_mac_watchdog_manifest.yml
        working-directory: ansible-setup
      - name: Generate manifest using personal vars
        run: ansible-playbook playbooks/export_mac_watchdog_manifest.yml
        working-directory: ansible-setup
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path.home()/'.local/state/mac-watchdog/expected-state.json'
          j=json.loads(p.read_text())
          assert j['schema_version']==1
          assert j['managed_categories']==['brew_formula']
          assert 'brew_formula:jq' in {r['resource_id'] for r in j['resources']}
          print('validated:',len(j['resources']),'expected resources')
          PY
      - name: Verify idempotency
        run: |
          ansible-playbook playbooks/export_mac_watchdog_manifest.yml | tee /tmp/watchdog-export-again.log
          grep -Eq 'changed=0' /tmp/watchdog-export-again.log
        working-directory: ansible-setup
