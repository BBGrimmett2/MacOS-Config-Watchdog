name: Validate Ansible canonical casks PR 30
on:
  pull_request:
    paths:
      - ".github/workflows/validate-cask-names-pr30.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BBGrimmett2/Ansible-MacOS-Setup
          ref: 28112fb1bf11cf6a927f49d1300493b51d30d456
          path: ansible-setup
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install 'ansible-core>=2.18,<2.21' PyYAML
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p test_watchdog_manifest.py -v
        working-directory: ansible-setup
      - name: Syntax checks
        run: |
          ansible-playbook --syntax-check playbooks/export_mac_watchdog_manifest.yml
          ansible-playbook --syntax-check playbooks/install_cloud_cli.yml
          ansible-playbook --syntax-check playbooks/install_network_tools.yml
        working-directory: ansible-setup
      - name: Generate manifest
        run: ansible-playbook playbooks/export_mac_watchdog_manifest.yml
        working-directory: ansible-setup
      - name: Verify canonical names and Azure remains expected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads((Path.home()/'.local/state/mac-watchdog/expected-state.json').read_text())
          ids={r['resource_id'] for r in d['resources']}
          assert {'brew_cask:gcloud-cli','brew_cask:wireshark-app','brew_formula:azure-cli'} <= ids
          assert not {'brew_cask:google-cloud-sdk','brew_cask:wireshark'} & ids
          print('canonical package expectations verified')
          PY
      - name: Verify idempotent export
        run: |
          ansible-playbook playbooks/export_mac_watchdog_manifest.yml | tee /tmp/second-run.log
          grep -q 'changed=0' /tmp/second-run.log
        working-directory: ansible-setup
