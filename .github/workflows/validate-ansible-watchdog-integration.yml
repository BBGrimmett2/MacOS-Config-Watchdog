name: Validate Ansible watchdog integration

on:
  pull_request:
    paths:
      - ".github/workflows/validate-ansible-watchdog-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested Ansible PR revision
        uses: actions/checkout@v4
        with:
          repository: BBGrimmett2/Ansible-MacOS-Setup
          ref: b42b19ff5d5cf934b443ce7495c69babf74ec674
          path: ansible-setup
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible tooling
        run: python -m pip install 'ansible-core>=2.18,<2.21'
      - name: Test watchdog role safety and plist
        run: python -m unittest discover -s tests/unit -p test_mac_watchdog_role.py -v
        working-directory: ansible-setup
      - name: Syntax check standalone watchdog playbook
        run: ansible-playbook --syntax-check playbooks/install_mac_watchdog.yml
        working-directory: ansible-setup
