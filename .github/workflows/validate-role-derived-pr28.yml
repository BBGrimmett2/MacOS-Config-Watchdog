name: Validate role-derived Ansible manifest PR 28

on:
  pull_request:
    paths:
      - ".github/workflows/validate-role-derived-pr28.yml"

permissions:
  contents: read

jobs:
  ansible-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Ansible PR commit
        uses: actions/checkout@v4
        with:
          repository: BBGrimmett2/Ansible-MacOS-Setup
          ref: d61b99d26b885d2997a56e55e569eced1ebbe13b
          path: ansible-setup
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install 'ansible-core>=2.18,<2.21' PyYAML jinja2
      - name: Run role and filter tests
        run: python -m unittest discover -s tests/unit -p test_watchdog_manifest.py -v
        working-directory: ansible-setup
      - name: Syntax validation
        run: ansible-playbook --syntax-check playbooks/export_mac_watchdog_manifest.yml
        working-directory: ansible-setup
      - name: Generate personal manifest
        run: ansible-playbook playbooks/export_mac_watchdog_manifest.yml
        working-directory: ansible-setup
      - name: Validate generated formula and cask resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path.home()/'.local/state/mac-watchdog/expected-state.json'
          document=json.loads(path.read_text())
          ids={entry['resource_id'] for entry in document['resources']}
          expected={'brew_formula:jq','brew_formula:awscli','brew_formula:kubernetes-cli','brew_formula:node','brew_formula:gh','brew_cask:google-chrome','brew_cask:wireshark','brew_cask:iterm2','brew_cask:font-meslo-lg-nerd-font'}
          assert expected <= ids, (expected-ids)
          assert document['managed_categories']==['brew_cask','brew_formula']
          assert 'brew_cask:cursor' not in ids
          assert 'brew_formula:nmap' not in ids
          print("validated",len(ids),"expected package resources")
          PY
      - name: Verify export is idempotent
        run: |
          ansible-playbook playbooks/export_mac_watchdog_manifest.yml | tee /tmp/watchdog-role-export.log
          grep -Eq 'changed=0' /tmp/watchdog-role-export.log
        working-directory: ansible-setup
