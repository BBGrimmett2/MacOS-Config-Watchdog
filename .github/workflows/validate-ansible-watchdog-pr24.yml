name: Validate Ansible watchdog idempotency PR 24

on:
  pull_request:
    paths:
      - ".github/workflows/validate-ansible-watchdog-pr24.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Ansible PR revision
        uses: actions/checkout@v4
        with:
          repository: BBGrimmett2/Ansible-MacOS-Setup
          ref: 6a0dd7853f7ebec508c6928881b7960f83ed2dde
          path: ansible-setup
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible tooling
        run: python -m pip install 'ansible-core>=2.18,<2.21'
      - name: Test watchdog role safety and idempotency
        run: python -m unittest discover -s tests/unit -p test_mac_watchdog_role.py -v
        working-directory: ansible-setup
      - name: Syntax check targeted watchdog playbook
        run: ansible-playbook --syntax-check playbooks/install_mac_watchdog.yml
        working-directory: ansible-setup
